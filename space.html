<style>
:root{
  --ink:#2d2c2b; --text:#4a4845; --muted:#6f6a65; --navy:#1f3d6b; --orange:#f5821f;
  --surface:rgba(255,255,255,.88); --line:rgba(0,0,0,.08); --bg:#faf8f5;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#f2efeb; --text:#d6d1cb; --muted:#a39d96; --navy:#8fb3e8;
         --surface:rgba(30,29,27,.88); --line:rgba(255,255,255,.12); --bg:#151412; }
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:"Inter",-apple-system,"Segoe UI","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
#scene{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none}
#scene.dragging{cursor:grabbing}
#scene.hovering{cursor:pointer}

.pill{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:980px; border:0;
  background:var(--surface); color:var(--ink); font:500 .88rem/1 "Inter",-apple-system,"Segoe UI",sans-serif; text-decoration:none;
  -webkit-backdrop-filter:saturate(180%) blur(16px); backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 2px 12px rgba(0,0,0,.10); cursor:pointer; white-space:nowrap}
a:focus-visible,button:focus-visible{outline:2px solid var(--navy); outline-offset:2px}

.top{position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px;
  padding:max(12px,env(safe-area-inset-top)) 16px 12px; pointer-events:none}
.top > *{pointer-events:auto}
.where{cursor:default; color:var(--muted)}
.where b{color:var(--ink); font-weight:600}
.menuwrap{position:relative}
#photoBtn{margin-left:auto}
.pill.on{background:var(--orange); color:#fff}
#photoBadge{position:fixed; z-index:4; left:16px; bottom:max(16px,env(safe-area-inset-bottom)); cursor:default; color:var(--muted)}
#photoBadge b{color:var(--ink); font-weight:600}
#menu{position:absolute; right:0; top:44px; margin:0; padding:6px; list-style:none; min-width:250px; max-height:70vh; overflow:auto;
  background:var(--surface); -webkit-backdrop-filter:saturate(180%) blur(16px); backdrop-filter:saturate(180%) blur(16px);
  border-radius:14px; box-shadow:0 10px 32px rgba(0,0,0,.18)}
#menu button{display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink); font:inherit; font-size:.88rem;
  padding:9px 12px; border-radius:9px; cursor:pointer}
#menu button span{color:var(--muted); font-size:.8rem}
#menu button:hover{background:var(--line)}

.hint{position:fixed; z-index:4; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%);
  height:auto; min-height:36px; padding:9px 16px; line-height:1.4; text-align:center; white-space:normal; width:max-content;
  max-width:calc(100% - 32px); cursor:default; transition:opacity .6s}
.hint.gone{opacity:0; pointer-events:none}

#tip{position:fixed; z-index:6; pointer-events:none; background:var(--surface); color:var(--ink); font-size:.8rem; font-weight:500;
  padding:5px 10px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.12); transform:translate(14px,14px); white-space:nowrap}

#panel{position:fixed; z-index:7; top:68px; right:16px; width:min(360px,calc(100% - 32px)); max-height:calc(100% - 100px); overflow:auto;
  background:var(--surface); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-radius:18px; padding:20px 22px 18px; box-shadow:0 14px 44px rgba(0,0,0,.20); animation:pop .22s ease}
@keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
#panel .kicker{margin:0; font-size:.72rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--navy)}
#panel h2{color:var(--ink); font-size:1.08rem; line-height:1.35; letter-spacing:-.015em; margin:4px 30px 6px 0}
#panel .meta{margin:0 0 8px; font-size:.86rem; color:var(--muted)}
#panel .body{margin:0 0 14px; font-size:.92rem; line-height:1.55}
#panel .links{display:flex; flex-wrap:wrap; gap:6px}
#panel .links a{font-size:.82rem; font-weight:500; padding:7px 13px; border-radius:980px; background:var(--orange); color:#fff; text-decoration:none}
#panel .links a.alt{background:var(--line); color:var(--ink)}
#close{position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; border:0; background:var(--line);
  color:var(--ink); font-size:1.1rem; line-height:1; cursor:pointer}

#loading{position:fixed; inset:0; z-index:8; display:grid; place-items:center; background:var(--bg); color:var(--muted);
  font-size:.9rem; transition:opacity .5s}
#loading.done{opacity:0; pointer-events:none}
#fallback{position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; background:var(--bg); color:var(--ink)}
#fallback a{color:var(--navy)}

@media (max-width:640px){
  #panel{top:auto; bottom:12px; left:12px; right:12px; width:auto; max-height:58vh}
  .hint{font-size:.8rem}
  .where span{display:none}
  #photoBtn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){ #panel{animation:none} .hint,#loading{transition:none} }

const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
// High quality = post-processing (ambient occlusion, bloom, SMAA) and sharper shadows. Desktop only.
let HQ = !coarse && Math.min(innerWidth, innerHeight * 1.6) >= 900;

/* ---------- Seoul time (UTC+9, no DST) ---------- */
function kst() {
  const t = (Date.now() / 1000 + 9 * 3600) % 86400;
  return { h: Math.floor(t / 3600), m: Math.floor(t / 60) % 60, s: t % 60 };
}
const pad = n => String(Math.floor(n)).padStart(2, '0');
const phaseOf = h => (h >= 20 || h < 5) ? 'night' : (h < 7 || h >= 17) ? 'dusk' : 'day';
const qTime = new URLSearchParams(location.search).get('time');   // ?time=day|dusk|night to preview
const PHASE = ['day', 'dusk', 'night'].includes(qTime) ? qTime : phaseOf(kst().h);

/* ---------- Content ---------- */
const ITEMS = {
  about: { label: 'Monitor', menu: 'Monitor', kicker: 'About',
    title: 'Hyuk An', meta: 'Research Associate, Korea Development Institute',
    body: 'Applied macroeconomics and monetary policy. This is a small 3D version of my office, Room K471 in Sejong. Walk around and open anything that glows.',

  cv: { label: 'A stack of paper', menu: 'Paper stack', kicker: 'CV',

    links: [['SSRN', 'https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6940898'], ['Slides', 'slides_llm_analyst_serc2026.pdf']] },
  fomc: { label: 'Whiteboard', menu: 'Whiteboard', kicker: 'Working paper',
    title: 'How the FOMC Weighs Its Dual Mandate',
    meta: 'Revise and resubmit, Economic Modelling',
    body: 'Large language models score the tone of each member’s remarks in the FOMC transcripts. The estimates say the FOMC puts more weight on the inflation gap than on the unemployment gap.',
    links: [['Paper (PDF)', 'An_FOMC_Dual_Mandate.pdf']] },
  serc: { label: 'Conference poster', menu: 'Poster', kicker: 'Conference',
    title: 'Singapore Economic Review Conference 2026', meta: 'Singapore',
    body: 'Presented “Simulating Analyst Forecast Behavior using LLMs” with Seohyun Lee.',
    links: [['Slides', 'slides_llm_analyst_serc2026.pdf']] },
  ku: { label: 'Korea University diploma', menu: 'Diploma, left', kicker: 'Education',
    title: 'Korea University', meta: 'Bachelor of Economics, with Great Honor · 2020–2023',
    body: 'Including an exchange semester at the National University of Singapore (Spring 2022).', links: [] },
  kdis: { label: 'KDI School diploma', menu: 'Diploma, right', kicker: 'Education',
    title: 'KDI School of Public Policy and Management',
    meta: 'Master of Public Policy, Finance and Macroeconomic Policy · expected Dec 2026', body: '', links: [] },
  crane: { label: 'Tower crane', menu: 'Tower crane', kicker: 'Policy report',
    title: 'Construction investment section', meta: 'KDI Monthly Economic Trends · from December 2026',
    body: 'I cover construction investment in KDI’s monthly report on the Korean economy. Hence the crane.',
    links: [['KDI Monthly Economic Trends', 'https://www.kdi.re.kr/eng/research/monTrends']] },
  clock: { label: 'Clock (Seoul time)', menu: 'Clock', kicker: 'Seoul time',
    title: '', meta: '', body: 'The view out the window follows Korean time too: daylight, dusk or night, depending on when you visit.', links: [] },
  door: { label: 'Exit', menu: 'Door', kicker: 'Exit',

    links: [['Back to homepage', 'index.html']] },

/* ---------- Renderer ---------- */
const canvas = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  $('#fallback').hidden = false; $('#hint').hidden = true; $('.top').hidden = true; $('#loading').hidden = true;
  throw err;
}
const PR = Math.min(devicePixelRatio, HQ ? 1.25 : 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);
const camera = new THREE.PerspectiveCamera(innerWidth < 640 ? 78 : 66, innerWidth / innerHeight, 0.05, 60);
camera.rotation.order = 'YXZ';

await Promise.race([
  Promise.all([document.fonts.load('600 40px Inter'), document.fonts.load('400 40px Inter')]),
  new Promise(r => setTimeout(r, 1500)),
]).catch(() => {});

/* ---------- Lighting presets by time of day ---------- */
const LIGHT = {
  day:   { hemi: .15, sun: 3.6, sunCol: 0xfff0d8, win: 1.6, winCol: 0xd6e7ff, ceil: 3.0, panel: 1.4, lamp: 1.0, env: .22 },
  dusk:  { hemi: .10, sun: 2.4, sunCol: 0xffa766, win: .8,  winCol: 0xffc596, ceil: 5.5, panel: 2.0, lamp: 2.2, env: .16 },
  night: { hemi: .05, sun: .30, sunCol: 0x8fa8ff, win: .15, winCol: 0x7088d0, ceil: 7.5, panel: 2.6, lamp: 2.8, env: .10 },
}[PHASE];

/* ---------- Helpers ---------- */
const FONT = '"Inter","Segoe UI",Arial,sans-serif';
const HAND = '"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive';
const SERIF = 'Georgia,"Times New Roman",serif';
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(471);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function tex(w, h, draw, { repeat, color = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = color ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = maxAniso;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, metalness: 0, envMapIntensity: LIGHT.env, ...o });
const phys = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: .6, metalness: 0, envMapIntensity: LIGHT.env, ...o });
// Self-lit surfaces (sky, screens). Emissive rather than "basic" so the ray tracer treats them as light sources.
const flat = map => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: map, roughness: 1, metalness: 0, envMapIntensity: 0, toneMapped: false });
const glassM = () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .04, metalness: 0, transparent: true, opacity: .12, envMapIntensity: 1.2, depthWrite: false });

function shadowy(m) { m.castShadow = true; m.receiveShadow = true; return m; }
function box(w, h, d, mat, x, y, z, parent = scene, r) {
  const rr = Array.isArray(mat) ? 0 : (r === undefined ? Math.min(.008, Math.min(w, h, d) * .3) : r);
  const geo = rr > 0 ? new RoundedBoxGeometry(w, h, d, 2, rr) : new THREE.BoxGeometry(w, h, d);
  const m = shadowy(new THREE.Mesh(geo, mat)); m.position.set(x, y, z); parent.add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent = scene, seg = 32, open = false) {
  const m = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat));
  m.position.set(x, y, z); parent.add(m); return m;
}
function lathe(pts, mat, x, y, z, parent = scene, seg = 48) {
  const m = shadowy(new THREE.Mesh(new THREE.LatheGeometry(pts.map(([a, b]) => new THREE.Vector2(a, b)), seg), mat));
  m.position.set(x, y, z); parent.add(m); return m;
}
function plane(w, h, mat, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.receiveShadow = true; parent.add(m); return m;
}
function group(x, y, z, ry = 0, parent = scene) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g;
}
function centerText(x, text, y, font, color, w) { x.font = font; x.fillStyle = color; x.textAlign = 'center'; x.fillText(text, w / 2, y); x.textAlign = 'left'; }

/* ---------- Procedural surface textures ---------- */
function plaster(base, repeat) {
  return tex(512, 512, (x, w, h) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 14000; i++) {
      const v = rnd(), s = 1 + rnd() * 2.5;
      x.fillStyle = v < .5 ? `rgba(0,0,0,${rnd() * .03})` : `rgba(255,255,255,${rnd() * .05})`;
      x.fillRect(rnd() * w, rnd() * h, s, s);
    }
  }, { repeat });
}
function woodGrain(base, dark, repeat = [1, 1], w = 1024, h = 512) {
  return tex(w, h, (x) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      const y0 = rnd() * h, amp = 2 + rnd() * 7, f = .003 + rnd() * .008, ph = rnd() * 6;
      x.strokeStyle = `rgba(${dark},${.04 + rnd() * .12})`; x.lineWidth = .6 + rnd() * 2;
      x.beginPath();
      for (let X = 0; X <= w; X += 8) { const Y = y0 + Math.sin(X * f + ph) * amp + Math.sin(X * f * 3.3 + ph * 2) * amp * .3; X ? x.lineTo(X, Y) : x.moveTo(X, Y); }
      x.stroke();
    }
  }, { repeat });
}
function planks() {
  const S = 2048, rows = 10, rh = S / rows;
  const col = document.createElement('canvas'), bmp = document.createElement('canvas');
  col.width = col.height = bmp.width = bmp.height = S;
  const c = col.getContext('2d'), b = bmp.getContext('2d');
  b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
  for (let r = 0; r < rows; r++) {
    let xp = -((r * .37) % 1) * S * .5;
    while (xp < S) {
      const len = S * (.4 + rnd() * .45), v = (rnd() - .5) * 30, y = r * rh;
      const g = c.createLinearGradient(0, y, 0, y + rh);
      g.addColorStop(0, `rgb(${168 + v},${125 + v * .8},${86 + v * .6})`); g.addColorStop(1, `rgb(${158 + v},${116 + v * .8},${80 + v * .6})`);
      c.fillStyle = g; c.fillRect(xp, y, len, rh);
      for (let k = 0; k < 16; k++) {
        const yy = y + rnd() * rh, a = .04 + rnd() * .1, amp = 2 + rnd() * 5;
        c.strokeStyle = `rgba(70,40,15,${a})`; c.lineWidth = .8 + rnd() * 1.6;
        b.strokeStyle = `rgba(60,60,60,${a})`; b.lineWidth = c.lineWidth;
        for (const ctx of [c, b]) { ctx.beginPath(); ctx.moveTo(xp, yy); ctx.bezierCurveTo(xp + len * .3, yy + amp, xp + len * .6, yy - amp, xp + len, yy); ctx.stroke(); }
      }
      if (rnd() < .25) { c.fillStyle = 'rgba(70,40,15,.25)'; c.beginPath(); c.ellipse(xp + rnd() * len, y + rh * (.3 + rnd() * .4), 10 + rnd() * 14, 5 + rnd() * 5, 0, 0, 7); c.fill(); }
      c.fillStyle = 'rgba(40,24,10,.55)'; c.fillRect(xp, y, 3, rh);
      b.fillStyle = '#202020'; b.fillRect(xp, y, 4, rh);
      xp += len;
    }
    c.fillStyle = 'rgba(40,24,10,.55)'; c.fillRect(0, r * rh, S, 3);
    b.fillStyle = '#202020'; b.fillRect(0, r * rh, S, 4);
  }
  const map = new THREE.CanvasTexture(col), bump = new THREE.CanvasTexture(bmp);
  map.colorSpace = THREE.SRGBColorSpace;
  for (const t of [map, bump]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1.5); t.anisotropy = maxAniso; }
  return { map, bump };
}

/* ---------- Interactive registry ---------- */
const items = {};
const visited = new Set();

interactive('crane', craneG, V3(3.38, 1.38, -2.47), V3(-.8, 0, .6));

/* ---------- Static batching ----------
   Merge meshes that share a material (and never move) into one mesh per material.
   Interactive objects are merged inside their own group so clicking still works. */
function batchStatic(root) {
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert(), buckets = new Map();
  (function visit(o) {
    for (const c of o.children) {
      if (c.userData.dynamic || (c.userData.id !== undefined && c !== root)) continue;
      if (c.isMesh && !c.isInstancedMesh && !Array.isArray(c.material) && !c.userData.walk && c.raycast === THREE.Mesh.prototype.raycast) {
        const key = `${c.material.uuid}|${c.castShadow}|${c.receiveShadow}`;
        if (!buckets.has(key)) buckets.set(key, { mat: c.material, cast: c.castShadow, recv: c.receiveShadow, list: [] });
        buckets.get(key).list.push(c);
      }
      visit(c);
    }
  })(root);
  const mtx = new THREE.Matrix4();
  for (const b of buckets.values()) {
    if (b.list.length < 2) continue;
    const geos = b.list.map(m => {
      const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
      g.clearGroups(); g.applyMatrix4(mtx.multiplyMatrices(inv, m.matrixWorld));
      return g;
    });
    const merged = mergeGeometries(geos, false);
    if (!merged) continue;
    const mesh = new THREE.Mesh(merged, b.mat); mesh.castShadow = b.cast; mesh.receiveShadow = b.recv; root.add(mesh);
    for (const m of b.list) m.removeFromParent();
  }
}
for (const id in items) batchStatic(items[id].root);
batchStatic(scene);
// Single-material meshes don't need per-face groups (rounded boxes come with six); the ray tracer would
// read them as material indices and shift every material after them.
scene.traverse(o => { if (o.isMesh && !Array.isArray(o.material) && o.geometry.groups.length) o.geometry.clearGroups(); });

// The room never moves, so the shadow map is rendered once instead of every frame.
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;

/* ---------- Post-processing (desktop) ---------- */
let composer = null;
function buildComposer() {
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  const setAOSize = gtao.setSize.bind(gtao);   // ambient occlusion at half resolution: most of the look, a fraction of the cost
  gtao.setSize = (w, h) => setAOSize(Math.round(w / 2), Math.round(h / 2));
  gtao.updateGtaoMaterial({ radius: .35, distanceExponent: 1.2, thickness: 1.2, scale: 1.1, samples: 12 });
  gtao.blendIntensity = .85;
  composer.addPass(gtao);
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .3, .45, 1.0));
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(innerWidth * PR, innerHeight * PR));
}
if (HQ) { try { buildComposer(); } catch (e) { console.warn('Post-processing disabled:', e); composer = null; HQ = false; } }

/* ---------- Collision ---------- */
const BOUNDS = { x0: -3.72, x1: 3.72, z0: -2.72, z1: 2.72 };
const OBST = [[-.95, .95, -3, -1.58], [-4, -3.5, -1.7, .5], [3.0, 4, -3, -2.08], [-3.8, -3.08, -2.9, -2.12]];
const R = .22;
function blocked(x, z) {
  if (x < BOUNDS.x0 || x > BOUNDS.x1 || z < BOUNDS.z0 || z > BOUNDS.z1) return true;
  return OBST.some(([a, b, c, d]) => x > a - R && x < b + R && z > c - R && z < d + R);
}

/* ---------- Camera state ---------- */
const pos = new THREE.Vector3(.7, 1.6, 2.15);
let yaw = .16, pitch = innerWidth < innerHeight ? -.16 : -.06;
let walkTarget = null, turnTarget = null;

/* ---------- Pick a quality level by timing this GPU ---------- */
camera.position.copy(pos); camera.rotation.set(pitch, yaw, 0);
renderer.compile(scene, camera);   // compile shaders up front so walking around doesn't stutter
function gpuMs(fn, n = 6) {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  fn(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);   // warm-up (and wait for the GPU)
  const t0 = performance.now();
  for (let i = 0; i < n; i++) fn();
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return (performance.now() - t0) / n;
}
try {
  if (composer && gpuMs(() => composer.render(.016)) > 7) { composer = null; renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); }
  if (!composer && gpuMs(() => renderer.render(scene, camera)) > 10) renderer.setPixelRatio(1);
} catch (e) { composer = null; }

function tryMove(dx, dz) {
  const ox = pos.x, oz = pos.z;
  if (!blocked(pos.x + dx, pos.z)) pos.x += dx;
  if (!blocked(pos.x, pos.z + dz)) pos.z += dz;
  return Math.hypot(pos.x - ox, pos.z - oz);
}

/* ---------- UI ---------- */
const panel = $('#panel'), tip = $('#tip'), hint = $('#hint'), menu = $('#menu'), menuBtn = $('#menuBtn');
if (coarse) hint.textContent = 'Drag to look around · Tap the floor to walk · Tap anything that glows';
let hintGone = false;
function dismissHint() { if (!hintGone) { hintGone = true; hint.classList.add('gone'); } }
setTimeout(dismissHint, 12000);

function openItem(id) {
  const it = ITEMS[id]; if (!it) return;
  visited.add(id);
  panel.querySelector('.kicker').textContent = it.kicker;
  const t = kst();
  panel.querySelector('h2').textContent = id === 'clock' ? `It’s ${pad(t.h)}:${pad(t.m)} in Sejong` : it.title;
  const meta = panel.querySelector('.meta'); meta.textContent = it.meta; meta.hidden = !it.meta;
  const body = panel.querySelector('.body'); body.textContent = it.body; body.hidden = !it.body;
  const links = panel.querySelector('.links'); links.replaceChildren();
  it.links.forEach(([label, href], i) => {
    const a = document.createElement('a'); a.textContent = label; a.href = href; if (i) a.className = 'alt';
    if (/^https?:|\.pdf$/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    links.append(a);
  });
  links.hidden = !it.links.length;
  panel.hidden = false;
  dismissHint();
}
function closePanel() { panel.hidden = true; }
$('#close').addEventListener('click', closePanel);

const ORDER = ['about', 'cv', 'econlet', 'kjio', 'llm', 'fomc', 'ku', 'kdis', 'crane', 'serc', 'clock', 'door'];
ORDER.forEach(id => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.innerHTML = `${ITEMS[id].menu} <span>· ${ITEMS[id].kicker}</span>`;
  b.addEventListener('click', () => { toggleMenu(false); goTo(id); openItem(id); });
  li.append(b); menu.append(li);
});
function toggleMenu(open) { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open)); }
menuBtn.addEventListener('click', () => toggleMenu(menu.hidden));
document.addEventListener('pointerdown', e => { if (!menu.hidden && !e.target.closest('.menuwrap')) toggleMenu(false); });

const tmpBox = new THREE.Box3();
function itemCenter(id) { return tmpBox.setFromObject(items[id].root).getCenter(new THREE.Vector3()); }
function goTo(id) {
  const root = items[id].root, c = itemCenter(id);
  let n = root.userData.facing;
  if (!n) { n = new THREE.Vector3(0, 0, 1).applyQuaternion(root.getWorldQuaternion(new THREE.Quaternion())); n.y = 0; n.normalize(); }
  walkTarget = null;
  for (const dist of [1.6, 1.3, 2.0, 1.0]) {
    const spot = { x: c.x + n.x * dist, z: c.z + n.z * dist };
    if (!blocked(spot.x, spot.z)) { walkTarget = spot; break; }
  }
  turnTarget = { id };
  if (reduced && walkTarget) { pos.x = walkTarget.x; pos.z = walkTarget.z; walkTarget = null; }
}
function aimAt(c) {
  const dx = c.x - pos.x, dz = c.z - pos.z;
  return { yaw: Math.atan2(-dx, -dz), pitch: Math.atan2(c.y - pos.y, Math.hypot(dx, dz)) };
}

/* ---------- Picking ---------- */
const ray = new THREE.Raycaster(); ray.camera = camera;
const ndc = new THREE.Vector2();
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(scene.children, true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && o.userData.id === undefined) o = o.parent;
  if (o) return { id: o.userData.id };
  if (hit.object.userData.walk) return { walk: hit.point };
  return null;
}
let hovered = null;
function setHover(id) {
  if (hovered === id) return;
  const paint = (key, hex) => key && items[key].root.traverse(m => {
    if (!m.material) return;
    [].concat(m.material).forEach(mt => { if (mt.emissive && !mt.emissiveMap) mt.emissive.setHex(hex); });
  });
  paint(hovered, 0x000000); paint(id, 0x2a2420);
  hovered = id; canvas.classList.toggle('hovering', !!id);
}

/* ---------- Pointer + keys ---------- */
let down = null, dragging = false, last = null;
canvas.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, id: e.pointerId }; last = { x: e.clientX, y: e.clientY }; dragging = false;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (down && e.pointerId === down.id) {
    if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { dragging = true; canvas.classList.add('dragging'); dismissHint(); tip.hidden = true; }
    if (dragging) {
      const k = e.pointerType === 'touch' ? .0062 : .0045;
      yaw += (e.clientX - last.x) * k; pitch += (e.clientY - last.y) * k;
      pitch = Math.max(-1.1, Math.min(1.1, pitch)); turnTarget = null;
    }
    last = { x: e.clientX, y: e.clientY };
    return;
  }
  if (e.pointerType !== 'mouse') return;
  if (photo) { tip.hidden = true; return; }   // no hover glow in photo mode (the ray tracer wouldn't see it)
  const p = pick(e.clientX, e.clientY);
  const id = p && p.id;
  setHover(id || null);
  if (id) { tip.hidden = false; tip.textContent = ITEMS[id].label; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }
  else tip.hidden = true;
});
function endPointer(e) {
  if (!down || e.pointerId !== down.id) return;
  if (!dragging && e.type === 'pointerup') {
    const p = pick(e.clientX, e.clientY);
    if (p && p.id) openItem(p.id);
    else if (p && p.walk) { walkTarget = { x: p.walk.x, z: p.walk.z }; turnTarget = null; dismissHint(); }
  }
  down = null; dragging = false; canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { if (!down) { setHover(null); tip.hidden = true; } });

const keys = new Set();
addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); toggleMenu(false); return; }
  if (e.target.closest && e.target.closest('#menu, #panel')) return;
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    keys.add(k); e.preventDefault(); walkTarget = null; turnTarget = null; dismissHint();
  }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < 640 ? 78 : 66; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

/* ---------- Photo mode (path tracing) ----------
   While the camera moves you see the normal render; once it stops, a GPU path tracer
   accumulates samples and the image converges toward a physically lit picture. */
const photoBtn = $('#photoBtn'), photoBadge = $('#photoBadge');
let pt = null, ptLoading = false, photo = false, lastSamples = -1;
const MAX_SAMPLES = 400;
const lastCam = { p: new THREE.Vector3(), q: new THREE.Quaternion() };
async function setPhoto(on) {
  photo = on; lastSamples = -1;
  photoBtn.setAttribute('aria-pressed', String(on)); photoBtn.classList.toggle('on', on);
  photoBadge.hidden = !on;
  for (const id in items) items[id].marker.visible = !on;
  for (const s of steam) s.visible = !on;
  if (!on) return;
  setHover(null); dismissHint();
  if (pt) { pt.updateCamera(); return; }
  if (ptLoading) return;
  ptLoading = true; photoBadge.textContent = 'Preparing the ray tracer…';
  try {
    // The path tracer reads scene.backgroundRotation / environmentRotation, which three r160 doesn't define yet.
    for (const k of ['backgroundRotation', 'environmentRotation']) if (!(k in THREE.Scene.prototype)) THREE.Scene.prototype[k] = new THREE.Euler();
    const { WebGLPathTracer } = await import('three-gpu-pathtracer');
    const { FullScreenQuad } = await import('three/addons/postprocessing/Pass.js');
    const tracer = new WebGLPathTracer(renderer);
    // Output filter: (1) clamp each texel to its 3x3 neighbourhood range, which removes isolated fireflies;
    // (2) edge-aware (bilateral) gaussian over 5x5 texels, measured from the exact pixel position, which both
    //     denoises and upscales the low-res trace smoothly. It eases off as samples accumulate.
    const outM = new THREE.ShaderMaterial({
      transparent: true, blending: THREE.NoBlending, depthTest: false, depthWrite: false,
      premultipliedAlpha: renderer.getContextAttributes().premultipliedAlpha,
      uniforms: { map: { value: null }, size: { value: new THREE.Vector2(1, 1) }, sigmaS: { value: 1 }, sigmaR: { value: .5 }, opacity: { value: 1 } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D map; uniform vec2 size; uniform float sigmaS, sigmaR, opacity;
        varying vec2 vUv;
        float lum(vec3 c) { return dot(c, vec3(.2126, .7152, .0722)); }
        vec3 tx(ivec2 p) { return texelFetch(map, clamp(p, ivec2(0), ivec2(size) - 1), 0).rgb; }
        vec3 declip(ivec2 p) {
          vec3 c = tx(p), mn = vec3(1e9), mx = vec3(0.);
          for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
            if (x == 0 && y == 0) continue;
            vec3 s = tx(p + ivec2(x, y)); mn = min(mn, s); mx = max(mx, s);
          }
          return clamp(c, mn, mx);
        }
        void main() {
          vec2 pos = vUv * size - .5; ivec2 base = ivec2(floor(pos + .5));
          vec3 ref = declip(base); float lr = lum(ref);
          vec3 acc = vec3(0.); float wsum = 0.;
          for (int y = -2; y <= 2; y++) for (int x = -2; x <= 2; x++) {
            ivec2 p = base + ivec2(x, y); vec3 s = tx(p);
            float dr = (lum(s) - lr) / (sigmaR * (lr + .02));
            vec2 d = vec2(p) - pos;
            float w = exp(-dot(d, d) / (2. * sigmaS * sigmaS) - .5 * dr * dr);
            acc += s * w; wsum += w;
          }
          gl_FragColor = vec4(wsum > 1e-4 ? acc / wsum : ref, 1.);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
          gl_FragColor.a = opacity;
          #include <premultiplied_alpha_fragment>
        }`,
    });
    const outQuad = new FullScreenQuad(outM);
    tracer.renderToCanvasCallback = (target, r, quad) => {
      const u = outM.uniforms, s = tracer.samples;
      u.map.value = target.texture; u.size.value.set(target.width, target.height);
      u.opacity.value = quad.material.opacity;
      u.sigmaS.value = s < 32 ? 1.4 : s < 128 ? 1.15 : 1.0;
      u.sigmaR.value = s < 32 ? .7 : s < 128 ? .5 : .38;
      const ac = r.autoClear; r.autoClear = false; outQuad.render(r); r.autoClear = ac;
    };
    const strongGPU = !!composer;                 // the start-up benchmark already told us how fast this GPU is
    tracer.tiles.set(strongGPU ? 2 : 3, strongGPU ? 2 : 3);   // small tiles per frame keep the page responsive
    tracer.bounces = 3;
    tracer.filterGlossyFactor = .5;               // fewer fireflies on glossy surfaces
    tracer.minSamples = 2;
    tracer.fadeDuration = 400;
    tracer.dynamicLowRes = false;
    // Trace a fixed pixel budget rather than a fixed fraction, so a big window doesn't make it crawl.
    const budget = coarse ? 80e3 : strongGPU ? 900e3 : 150e3;
    tracer.renderScale = Math.min(.75, Math.max(.2, Math.sqrt(budget / (innerWidth * innerHeight * renderer.getPixelRatio() ** 2))));
    scene.environmentIntensity = .3;
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));   // let "Preparing…" paint first
    // The tracer only takes equirect environment maps; the room is closed anyway, so hand it none.
    // Small, very bright glowing surfaces only add fireflies (the real lights already do the lighting),
    // so the tracer gets toned-down copies of the ceiling panel and lamp bulb.
    // Same idea for the sky: light that only arrives by randomly hitting the window is noisy, so the sky glows
    // less for the tracer and the window's area light (which it samples directly) does more of the work.
    const env = scene.environment, panelI = panelM.emissiveIntensity, bulbI = bulb.material.emissiveIntensity;
    const skyI = sky.material.emissiveIntensity, winI = winLight.intensity;
    scene.environment = null; panelM.emissiveIntensity = .5; bulb.material.emissiveIntensity = .6;
    sky.material.emissiveIntensity = .35; winLight.intensity = winI * 2.5;
    try { tracer.setScene(scene, camera); }        // builds the BVH on the main thread (well under a second for this room)
    finally {
      scene.environment = env; panelM.emissiveIntensity = panelI; bulb.material.emissiveIntensity = bulbI;
      sky.material.emissiveIntensity = skyI; winLight.intensity = winI;
    }
    pt = tracer;
    lastCam.p.set(NaN, 0, 0);                      // force a camera sync on the next frame
  } catch (err) {
    console.warn('Photo mode unavailable:', err);
    photoBadge.textContent = 'Ray tracing isn’t supported in this browser';
    setTimeout(() => setPhoto(false), 2500);
  } finally { ptLoading = false; }
}
photoBtn.addEventListener('click', () => setPhoto(!photo));

/* ---------- Loop ---------- */
const clockT = new THREE.Clock();
const hudTime = $('#hudTime');
let lastMinute = -1, perfFrames = 0, perfTime = 0, firstFrame = true, quality = composer ? 0 : 1;
renderer.setAnimationLoop(() => {
  const raw = clockT.getDelta(), dt = Math.min(raw, .05), time = clockT.elapsedTime;

  // Adaptive quality: if frames are slow, drop post-processing first, then resolution.
  if (quality < 2 && raw < .25 && !document.hidden) {
    perfFrames++; perfTime += raw;
    if (perfFrames === 60) {
      if (perfTime / perfFrames > 1 / 50) {
        if (composer) { composer = null; renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); quality = 1; }
        else { renderer.setPixelRatio(Math.min(devicePixelRatio, 1)); quality = 2; }
      } else quality = 2;
      perfFrames = 0; perfTime = 0;
    }
  }

  const fwd = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
  const side = (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0);
  const turn = (keys.has('arrowleft') || keys.has('q') ? 1 : 0) - (keys.has('arrowright') || keys.has('e') ? 1 : 0);
  yaw += turn * 1.8 * dt;
  if (fwd || side) {
    const sp = 2.2 * dt, n = Math.hypot(fwd, side);
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    tryMove((fx * fwd + rx * side) / n * sp, (fz * fwd + rz * side) / n * sp);
  }

  if (walkTarget) {
    const dx = walkTarget.x - pos.x, dz = walkTarget.z - pos.z, d = Math.hypot(dx, dz);
    if (d < .04) walkTarget = null;
    else {
      const step = Math.min(d, 2.4 * dt), moved = tryMove(dx / d * step, dz / d * step);
      if (moved < step * .3) walkTarget = null;
    }
  }

  if (turnTarget) {
    const a = aimAt(itemCenter(turnTarget.id));
    if (!panel.hidden && innerWidth >= 640) a.yaw -= .2;   // keep the object clear of the side panel
    let dy = a.yaw - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    const k = reduced ? 1 : Math.min(1, dt * 5);
    yaw += dy * k; pitch += (a.pitch - pitch) * k;
    if (Math.abs(dy) < .002 && Math.abs(a.pitch - pitch) < .002 && !walkTarget) turnTarget = null;
  }

  camera.position.copy(pos); camera.rotation.set(pitch, yaw, 0);

  const t = kst();
  if (!photo) {   // in photo mode the scene is frozen so the ray tracer can keep accumulating
    secH.rotation.z = -t.s / 60 * Math.PI * 2;
    minH.rotation.z = -(t.m + t.s / 60) / 60 * Math.PI * 2;
    hourH.rotation.z = -((t.h % 12) + t.m / 60) / 12 * Math.PI * 2;
  }
  if (t.m !== lastMinute) { lastMinute = t.m; hudTime.textContent = `${pad(t.h)}:${pad(t.m)}`; }

  if (!reduced && !photo) {
    jib.rotation.y += dt * .25;
    for (const s of steam) {
      s.userData.t = (s.userData.t + dt * .22) % 1; const u = s.userData.t;
      s.position.set(.6 + Math.sin(u * 6 + s.id) * .012, .87 + u * .2, -2.44);
      s.scale.setScalar(.03 + u * .07); s.material.opacity = Math.sin(u * Math.PI) * .35;
    }
  }
  for (const id in items) {
    const m = items[id].marker.material;
    const base = reduced ? .9 : .6 + .4 * Math.sin(time * 2.6 + items[id].marker.userData.phase);
    m.opacity = visited.has(id) ? base * .35 : base;
  }

  if (photo && pt) {
    camera.updateMatrixWorld();
    if (!camera.position.equals(lastCam.p) || !camera.quaternion.equals(lastCam.q)) {
      lastCam.p.copy(camera.position); lastCam.q.copy(camera.quaternion); pt.updateCamera();
    }
    if (pt.samples < MAX_SAMPLES) pt.renderSample();   // once converged, stop and let the GPU rest (the canvas keeps the last frame)
    const n = Math.min(MAX_SAMPLES, Math.floor(pt.samples));
    if (n !== lastSamples) {
      lastSamples = n;
      photoBadge.innerHTML = n < 1 ? 'Hold still to ray trace'
        : n >= MAX_SAMPLES ? `<b>Done</b> · ${n} samples` : `<b>Ray tracing</b> · ${n} sample${n === 1 ? '' : 's'}`;
    }
  } else if (composer) composer.render(dt); else renderer.render(scene, camera);
  if (firstFrame) { firstFrame = false; $('#loading').classList.add('done'); setTimeout(() => { $('#loading').hidden = true; }, 700); }
});
</script>
